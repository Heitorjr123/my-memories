<div class="mural-container">
  <div
    class="memory-grid"
    cdkDropList
    cdkDropListOrientation="horizontal"
    (cdkDropListDropped)="drop($event)"
  >
    @for (item of memories; track item) {
      <app-memory
        cdkDrag
        [id]="item.id"
        [title]="item.title"
        [user]="item.user"
        [description]="item.description"
        [date]="item.date"
        [color]="item.color"
        (onEdit)="editar($event)"
        (onDelete)="excluir($event)"
      >
        <div class="custom-placeholder" *cdkDragPlaceholder></div>
      </app-memory>
    }
  </div>

  <button class="fab-add" [routerLink]="['/memory', 0]">
    <fa-icon [icon]="plusIcon"></fa-icon>
  </button>
</div>
