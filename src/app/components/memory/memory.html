<div class="memory" [style.background-color]="color">
  <div class="memory-actions">
    <button class="btn-action edit" (click)="edit()" title="Editar">
      <fa-icon [icon]="iconeAlterar"></fa-icon>
    </button>
    <button class="btn-action delete" (click)="delete()" title="Excluir">
      <fa-icon [icon]="iconeExcluir"></fa-icon>
    </button>
  </div>

  <div class="memory-header">
    <h3 class="title">{{ title }}</h3>
    <span class="user">@{{ user }}</span>
  </div>

  <div class="memory-content">
    <p>{{ description }}</p>

    <div class="memory-type-tag">
      <fa-icon [icon]="getTypeIcon()"></fa-icon>
      <span>{{ type }}</span>
    </div>
  </div>

  <div class="memory-footer">
    <span class="date">{{ date | date: 'dd/MM/yyyy' }}</span>
  </div>
</div>
